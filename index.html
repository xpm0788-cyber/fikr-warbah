 }
 else{const bc=new BroadcastChannel('fikr-'+(room||'local'));tx={send:st=>bc.postMessage({t:'state',st}),req:()=>bc.postMessage({t:'req'})};
  bc.onmessage=e=>{if(e.data.t==='state'&&mode==='screen')applyRemote(e.data.st);if(e.data.t==='req'&&mode==='control')bc.postMessage({t:'state',st:snapshot()})};
  note('وضع محلي: يعمل بين نافذتين على نفس الجهاز والمتصفح فقط. لربط الهاتف بالشاشة انشر المشروع على Netlify (انظر README).')}
